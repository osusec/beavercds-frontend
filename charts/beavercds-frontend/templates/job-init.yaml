apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "beavercds-frontend.fullname" . }}-init-{{ .Release.Revision }}
  labels:
    {{- include "beavercds-frontend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "2"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "beavercds-frontend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      serviceAccountName: {{ include "beavercds-frontend.serviceAccountName" . }}

      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      initContainers:
        - {{- include "beavercds-frontend.initWaitForPostgres" . | nindent 10 }}

      containers:
      - name: frontend-init
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}

        command: ["python3", "manage.py", "ensureadmin"]

        volumeMounts:
          - name: django-settings
            mountPath: /app/bctf/helm_settings.py
            subPath: helm_settings.py
            readOnly: true
          {{- with .Values.volumeMounts }}
          {{- toYaml . | nindent 12 }}
          {{- end }}

      volumes:
        - name: django-settings
          configMap:
            name: {{ include "beavercds-frontend.fullname" . }}-django-settings
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
