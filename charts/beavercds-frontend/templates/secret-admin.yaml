{{- if .Values.adminUser.create }}
apiVersion: v1
kind: Secret
type: Opaque

metadata:
  name: {{ include "beavercds-frontend.fullname" . }}-admin-credentials
  labels:
    # keep this after deletion for reference
    helm.sh/resource-policy: keep
    {{- include "beavercds-frontend.labels" . | nindent 4 }}

stringData:
  DJANGO_ADMIN_USERNAME: {{ .Values.adminUser.username | required "'.Values.adminUser.username' must be set to provision the admin user!" }}
  DJANGO_ADMIN_PASSWORD: {{ .Values.adminUser.password | default (randAlphaNum 32) }}
{{- end }}
