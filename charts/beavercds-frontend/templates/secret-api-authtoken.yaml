{{- if not .Values.apiAuthToken.existingSecret }}
apiVersion: v1
kind: Secret
type: Opaque

metadata:
  name: {{ include "beavercds-frontend.apiAuthTokenSecretName" . }}
  labels:
    # keep this after deletion for reference
    helm.sh/resource-policy: keep
    {{- include "beavercds-frontend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"

stringData:
  BCTF_API_AUTHTOKEN: {{ .Values.apiAuthToken.value | default (randAlphaNum 32) | quote }}
{{- end }}
