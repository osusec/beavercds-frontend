{{- if not .Values.apiAuthToken.existingSecret }}
apiVersion: v1
kind: Secret
type: Opaque

metadata:
  name: {{ include "beavercds-frontend.apiAuthTokenSecretName" . }}
  labels:
    # keep this after deletion for reference
    helm.sh/resource-policy: keep
    {{- include "beavercds-frontend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"

{{- /*
  If no token is set in values, reuse the one from the existing Secret so it is
  not regenerated on every upgrade; only generate a new one on first install.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "beavercds-frontend.apiAuthTokenSecretName" .) }}
{{- $existingToken := dig "data" "BCTF_API_AUTHTOKEN" "" $existing | b64dec }}

stringData:
  BCTF_API_AUTHTOKEN: {{ .Values.apiAuthToken.value | default $existingToken | default (randAlphaNum 32) | quote }}
{{- end }}
