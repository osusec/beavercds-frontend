{{/*
  Secret for explicitly-set database credentials. This is used if the user
  specifies db creds directly in values instead of an existing secret.
*/}}
{{- if not .Values.database.existingSecret }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: {{ include "beavercds-frontend.dbSecretName" . }}
  labels:
    {{- include "beavercds-frontend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
stringData:
  host: {{
    required "'.Values.database.host' is required for the database credential secret!"
    .Values.database.host | quote
  }}
  port: {{
    required "'.Values.database.port' is required for the database credential secret!"
    .Values.database.port | default "5432" | quote
  }}
  username: {{
    required "'.Values.database.username' is required for the database credential secret!"
    .Values.database.username | quote
  }}
  password: {{
    required "'.Values.database.password' is required for the database credential secret!"
    .Values.database.password | quote
  }}
  dbname: {{
    required "'.Values.database.dbname' is required for the database credential secret!"
    .Values.database.dbname | quote
  }}
{{- end }}
