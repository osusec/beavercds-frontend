apiVersion: v1
kind: Service
metadata:
  name: {{ include "beavercds-frontend.fullname" . }}-static
  labels:
    {{- include "beavercds-frontend.labels" . | nindent 4 }}
    app.kubernetes.io/component: static
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 8080
      name: static
      targetPort: 8080
      protocol: TCP
  selector:
    {{- include "beavercds-frontend.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: static
