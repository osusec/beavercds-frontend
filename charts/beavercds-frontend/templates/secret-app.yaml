{{- if not .Values.appSecrets.existingSecret }}
apiVersion: v1
kind: Secret
type: Opaque

metadata:
  name: {{ include "beavercds-frontend.appSecretName" . }}
  labels:
    # keep this after deletion for reference
    helm.sh/resource-policy: keep
    {{- include "beavercds-frontend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"

stringData:
  BCTF_SECRET_KEY: {{ .Values.appSecrets.secretKey | default (randAlphaNum 50) | quote }}
  BCTF_CTFTIME_CLIENTID: {{ .Values.appSecrets.ctftimeClientId | quote }}
  BCTF_CTFTIME_CLIENTSECRET: {{ .Values.appSecrets.ctftimeClientSecret | quote }}
{{- end }}
