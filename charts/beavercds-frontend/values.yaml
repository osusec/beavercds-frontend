# Default values for beavercds-frontend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Settings to pass as additional config.py. All variables defined in this
# example are required, but should be edited to match your CTF.
config: |
  from django.utils.timezone import datetime

  CTF_EVENT_NAME = 'My CTF'

  # ISO 8601 format, UTC timezone
  CTF_EVENT_START = '2000-01-01 00:00:00'
  CTF_EVENT_END = '2000-01-03 00:00:00'

  # Social button links
  CTF_CTFTIME_LINK = ''
  CTF_GITLAB_LINK = ''
  CTF_DISCORD_LINK = ''
  CTF_EMAIL_LINK = ''
  CTF_BSKY_LINK = ''

  SPONSORS = [
      {
          'name': 'Fake Corp',
          'link': 'https://fake.example',
          'logo_link': 'https://fake.example/assets/logo.png'
      }
  ]

  # Number of solves required for a challenge to reach its minimum points using
  # dynamic scoring
  THRESHOLD_SOLVES = 20

# Settings for the scoreboard admin user/team.
# These will *only take effect* during the first install!
adminUser:
  # Whether to create an admin user.
  create: true
  # Username (team name) of the admin user.
  username: adminuser
  # Password to set for the admin user. Leave blank to autogenerate one.
  password: ""

# Database connection settings.
database:
  # Use an existing secret for database credentials. This secret must have the
  # following keys: host, post, username, password, dbname.
  #
  # (This is the same format used by CloudNativePG-style credentials secrets,
  # and so those can be directly used here.)
  existingSecret: ""

  # If `existingSecret` is not set, the following can be used to specify the
  # database credentials instead. This is *not* recommended for production use!
  # Use `existingSecret` to keep credentials out of the helm values.
  host: ""
  port: "5432"
  username: postgres
  password: ""
  dbname: bctf

# Application secrets (Django SECRET_KEY and CTFtime OAuth app credentials).
# These are loaded directly as environment variables matching their key names
# below.
#
# Note: BCTF_ALLOWED_HOSTS is not configured here; it is derived automatically
# from `ingress.hosts` / `httpRoute.hostnames`. The frontend-api auth token is
# also managed separately, see `apiAuthToken` below.
appSecrets:
  # Use an existing secret for these values instead of the generated one
  # below. This secret must have the following keys: BCTF_SECRET_KEY,
  # BCTF_ALLOWED_HOSTS, BCTF_CTFTIME_CLIENTID, BCTF_CTFTIME_CLIENTSECRET.
  existingSecret: ""

  # Django secret key. Leave blank to autogenerate one on install.
  secretKey: ""
  # CTFtime OAuth app credentials. Leave blank to disable CTFtime login.
  ctftimeClientId: ""
  ctftimeClientSecret: ""

# Auth token used by the frontend-api service. Kept in its own Secret (rather
# than alongside `appSecrets`) since this is a value that external callers
# need to be given; see the post-install NOTES for how to fetch it.
apiAuthToken:
  # Use an existing secret for the token instead of the generated one below.
  # This secret must have a `BCTF_API_AUTHTOKEN` key.
  existingSecret: ""

  # Leave blank to autogenerate one on install.
  value: ""

# Deployment/Pod settings
# scoreboard:
replicaCount: 1

image:
  repository: ghcr.io/osusec/beavercds-frontend
  pullPolicy: IfNotPresent
  tag: main # TODO: default to app version when we start cutting releases!

# Static file server settings. This serves all static files for the Django appSecrets
# i.e. everything known to `collectstatic`.
static:
  replicaCount: 1

  image:
    repository: docker.io/library/caddy
    pullPolicy: Always
    tag: 2-alpine

  resources: {}

  # Container-level securityContext for the Caddy container. The official Caddy
  # binary carries the cap_net_bind_service file capability, which fails to exec
  # if that capability is dropped, so it is added back here (Caddy itself only
  # listens on unprivileged port 8080).
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE

imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

# Passed through to the pod-level securityContext for all chart pods.
# Only pod-level fields are valid here (container-level fields such as
# `capabilities` or `allowPrivilegeEscalation` go under `securityContext` below).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000 # This is the default non-root user in our release image.

# Passed through to the container-level securityContext for all chart
# containers. Defaults to reasonable least-privilege permissions.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: beavercds-frontend

service:
  type: ClusterIP

# Expose via Ingress and ingress controller
ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # Note! This is directly an array of hostnames. We do not expose custom path
  # conditions.
  hosts:
    - scoreboard.beavercds.example
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - scoreboard.beavercds.example

# Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  enabled: false
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  hostnames:
    - scoreboard.beavercds.example
  # we do not expose custom path rules
  # rules:


# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes to add to all deployments.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

# Additional envFrom entries added to all chart containers (and the
# wait-for-postgres init container), Use this to inject your own
# ConfigMaps/Secrets as environment variables.
extraEnvFrom: []
  # - secretRef:
  #     name: my-extra-secret
  # - configMapRef:
  #     name: my-extra-configmap

nodeSelector: {}

tolerations: []

affinity: {}
