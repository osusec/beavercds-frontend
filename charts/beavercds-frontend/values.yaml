# Default values for beavercds-frontend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Settings to pass as additional config.py
config: |
  from django.utils.timezone import datetime

  CTF_EVENT_NAME = 'My CTF'

  # ISO 8601 format, UTC timezone
  CTF_EVENT_START = datetime.fromisoformat('1979-01-01 00:00:00')
  CTF_EVENT_END = datetime.fromisoformat('1979-01-03 00:00:00')

  # Social button links
  CTF_CTFTIME_LINK = ''
  CTF_GITLAB_LINK = ''
  CTF_DISCORD_LINK = ''
  CTF_EMAIL_LINK = ''
  CTF_BSKY_LINK = ''

  SPONSORS = [
      {
          'name': 'Fake Corp',
          'link': 'https://fake.example',
          'logo_link': 'https://fake.example/assets/logo.png'
      }
  ]

  # Number of solves required for a challenge to reach its minimum points using
  # dynamic scoring
  THRESHOLD_SOLVES = 20


# Deployment/Pod settings
# scoreboard:
replicaCount: 1

image:
  repository: ghcr.io/osusec/beavercds-frontend
  pullPolicy: IfNotPresent
  tag: main # TODO: default to app version when we start cutting releases!

imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
  # fsGroup: 2000


service:
  type: ClusterIP

# Expose via Ingress and ingress controller
ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: scoreboard.beavercds.example
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - scoreboard.beavercds.example

# Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  enabled: false
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  hostnames:
    - scoreboard.beavercds.example
  rules:
    - matches:
        - path:
            value: /

resources: {}

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
